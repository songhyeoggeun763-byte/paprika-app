<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>파프리카 방제수첩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 폰은 한 열 + 하단 메뉴, PC는 왼쪽 메뉴 + 본문.
   색: 온실 잎색 바탕, 파프리카 빨강은 금지·위험에만, '확인 필요'는 남색 점선으로 어디서나 같은 모양. */
:root {
  --bg: #F1F5EE; --surface: #FFFFFF; --surface2: #E8EFE4; --ink: #15251B; --ink2: #44554A; --ink3: #66766B; --line: #D4DED1;
  --leaf: #17603F; --leaf-ink: #FFFFFF; --leaf-soft: #DCEBDF;
  --pepper: #BE2C18; --pepper-soft: #FBE3DE;
  --amber: #8F5300; --amber-soft: #FBEDCF;
  --ok: #166F43; --ok-soft: #D9EFE2;
  --need: #434AA6; --need-soft: #E5E6F7;
  --fr: #B83A6E; --fr-soft: #F8E2EB; --ir: #1C6DD0; --ir-soft: #DEEAFB;
  --sun: #F2B705;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --display: "Do Hyeon", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1712; --surface: #18231C; --surface2: #213027; --ink: #E8F0EA; --ink2: #B6C5BA; --ink3: #8FA096; --line: #2F4136;
    --leaf: #57B98A; --leaf-ink: #06170E; --leaf-soft: #1D3A2B;
    --pepper: #FF8A75; --pepper-soft: #431C15;
    --amber: #F2B860; --amber-soft: #3B2B10;
    --ok: #6FD3A0; --ok-soft: #173526;
    --need: #AEB3F5; --need-soft: #262A52;
    --fr: #DB5F96; --fr-soft: #3D1B2B; --ir: #2FA3C4; --ir-soft: #123243;
    --sun: #F2B705;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1712; --surface: #18231C; --surface2: #213027; --ink: #E8F0EA; --ink2: #B6C5BA; --ink3: #8FA096; --line: #2F4136;
  --leaf: #57B98A; --leaf-ink: #06170E; --leaf-soft: #1D3A2B;
  --pepper: #FF8A75; --pepper-soft: #431C15;
  --amber: #F2B860; --amber-soft: #3B2B10;
  --ok: #6FD3A0; --ok-soft: #173526;
  --need: #AEB3F5; --need-soft: #262A52;
  --fr: #DB5F96; --fr-soft: #3D1B2B; --ir: #2FA3C4; --ir-soft: #123243;
  --sun: #F2B705;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--font); word-break: keep-all; overflow-wrap: anywhere; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--leaf); }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 1.1rem; line-height: 1.35; text-wrap: balance; }
a { color: var(--leaf); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 6px; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink3); }
.small { font-size: .875rem; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.between { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; min-width: 0; }
.grow { flex: 1 1 auto; min-width: 0; }

/* 틀 */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
.main { min-width: 0; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
.page { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--leaf); color: var(--leaf-ink); }
.topbar-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 8px; min-height: 56px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar h1 { font: 400 1.35rem/1.2 var(--display); }
.icon-btn { background: none; border: 0; color: inherit; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; flex: none; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav button { background: none; border: 0; padding: 8px 2px 6px; min-height: 60px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .75rem; color: var(--ink2); }
.nav button.on { color: var(--leaf); font-weight: 700; }
.nav-brand { display: none; }

@media (min-width: 960px) {
  .shell { grid-template-columns: 216px minmax(0, 1fr); }
  .nav { position: sticky; top: 0; height: 100vh; bottom: auto; right: auto; display: flex; flex-direction: column; gap: 4px; border-top: 0; border-right: 1px solid var(--line); padding: 16px 10px; }
  .nav-brand { display: block; font: 400 1.4rem/1.2 var(--display); padding: 6px 10px 14px; color: var(--leaf); }
  .nav button { flex-direction: row; gap: 12px; padding: 10px 12px; min-height: 48px; font-size: 1rem; border-radius: 10px; text-align: left; }
  .nav button.on { background: var(--leaf-soft); }
  .main { padding-block: 0 48px; }
}

/* 칸 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.card.flat { background: transparent; border: 0; padding: 0; }
.step-title { display: flex; gap: 10px; align-items: center; }
.step-no { width: 28px; height: 28px; border-radius: 50%; background: var(--leaf); color: var(--leaf-ink); display: grid; place-items: center; font-weight: 700; font-size: .9rem; flex: none; }
.banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; font-size: .92rem; background: var(--need-soft); border: 1px dashed var(--need); }
.banner.warn { background: var(--amber-soft); border: 1px solid var(--amber); }
.banner.bad { background: var(--pepper-soft); border: 1px solid var(--pepper); }

/* 단추 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--leaf); border-color: var(--leaf); color: var(--leaf-ink); font-weight: 700; }
.btn.big { min-height: 60px; font-size: 1.15rem; width: 100%; }
.btn.danger { color: var(--pepper); border-color: var(--pepper); }
.btn.small { min-height: 40px; padding: 4px 12px; font-size: .92rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.on { background: var(--leaf-soft); border-color: var(--leaf); color: var(--leaf); font-weight: 700; }
.linkish { background: none; border: 0; padding: 0; color: var(--leaf); text-decoration: underline; min-height: 32px; }

/* 홈 */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-height: 124px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; text-align: left; }
.tile b { font: 400 1.35rem/1.25 var(--display); }
.tile .ic { width: 30px; height: 30px; color: var(--leaf); }
.tile.hero { grid-column: 1 / -1; min-height: 132px; background: var(--leaf); border-color: var(--leaf); color: var(--leaf-ink); flex-direction: row; align-items: center; }
.tile.hero b { font-size: 1.75rem; }
.tile.hero .ic { color: inherit; width: 40px; height: 40px; }
.tile.wide { grid-column: 1 / -1; min-height: 84px; flex-direction: row; align-items: center; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.kpi b { display: block; font-size: 1.7rem; line-height: 1.15; font-variant-numeric: tabular-nums; }

/* 교호 띠 */
.belt { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
.belt-col { flex: 0 0 auto; min-width: 74px; display: flex; flex-direction: column; gap: 4px; align-items: stretch; border-top: 3px solid var(--line); padding-top: 6px; }
.belt-col.now { border-top-color: var(--leaf); }
.belt-date { font-size: .78rem; color: var(--ink3); font-variant-numeric: tabular-nums; }

/* 칩 */
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 6px 14px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); }
.chip.on { background: var(--leaf); border-color: var(--leaf); color: var(--leaf-ink); font-weight: 700; }
.chip.sm { min-height: 36px; padding: 2px 12px; font-size: .92rem; }
.moa { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 5px; font-size: .84rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; border: 1px solid transparent; }
.moa.f { background: var(--fr-soft); color: var(--ink); border-color: var(--fr); }
.moa.i { background: var(--ir-soft); color: var(--ink); border-color: var(--ir); }
.moa.u { background: var(--surface2); color: var(--ink2); border-color: var(--line); }
.need { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 5px; font-size: .84rem; font-weight: 700; background: var(--need-soft); color: var(--need); border: 1px dashed var(--need); white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 12px; font-size: .82rem; font-weight: 700; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--amber-soft); color: var(--amber); }
.pill.bad { background: var(--pepper-soft); color: var(--pepper); }
.pill.plain { background: var(--surface2); color: var(--ink2); }
.use { display: inline-flex; padding: 1px 7px; border-radius: 5px; font-size: .8rem; font-weight: 700; background: var(--surface2); color: var(--ink2); }
.use.살균 { background: var(--fr-soft); }
.use.살충 { background: var(--leaf-soft); }
.use.균충 { background: var(--need-soft); }

/* 입력 */
label.f { display: flex; flex-direction: column; gap: 4px; font-weight: 500; min-width: 0; }
.input, select.input, textarea.input { width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 400; }
textarea.input { min-height: 84px; resize: vertical; }
.form2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 460px) { .form2 { grid-template-columns: minmax(0, 1fr); } }
.hint { font-size: .85rem; color: var(--ink3); font-weight: 400; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.tabs button { flex: 0 0 auto; min-height: 44px; padding: 6px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.tabs button.on { background: var(--leaf); border-color: var(--leaf); color: var(--leaf-ink); font-weight: 700; }

/* 결과 */
.rank { display: inline-grid; place-items: center; min-width: 54px; height: 30px; padding: 0 8px; border-radius: 8px; background: var(--leaf); color: var(--leaf-ink); font: 400 1.05rem/1 var(--display); }
.rank.r2 { background: var(--leaf-soft); color: var(--leaf); }
.rank.r3 { background: var(--surface2); color: var(--ink2); }
.rec-card { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.rec-card.picked { border-color: var(--leaf); box-shadow: inset 0 0 0 1px var(--leaf); }
.rec-name { font-size: 1.2rem; font-weight: 700; line-height: 1.3; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.fact { background: var(--surface2); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.fact span { display: block; font-size: .76rem; color: var(--ink3); }
.fact b { font-size: .98rem; font-variant-numeric: tabular-nums; }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li + li { margin-top: 3px; }
.issue { padding: 8px 10px; border-radius: 8px; font-size: .92rem; }
.issue.warn { background: var(--amber-soft); }
.issue.info { background: var(--surface2); }
.issue.block, .issue.except { background: var(--pepper-soft); }
.issue.verify { background: var(--need-soft); }
details.more { border-top: 1px solid var(--line); padding-top: 6px; }
details.more > summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; font-weight: 500; color: var(--leaf); }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .9rem; }
.tbl th { text-align: left; font-weight: 500; color: var(--ink3); white-space: nowrap; }
.tbl th, .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.n { text-align: right; font-variant-numeric: tabular-nums; }

/* 맨 아래 선택 막대 */
.tray { position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 24; background: var(--surface); border-top: 2px solid var(--leaf); padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); }
.tray-in { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.tray-text { min-width: 0; flex: 1 1 160px; font-size: .92rem; }
@media (min-width: 960px) { .tray { left: 216px; bottom: 0; } }

/* 이력 */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal .dow { text-align: center; font-size: .8rem; color: var(--ink3); padding: 2px 0; }
.day { min-height: 58px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 3px; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left; min-width: 0; }
.day.off { visibility: hidden; }
.day.today { border-color: var(--leaf); border-width: 2px; }
.day.sel { background: var(--leaf-soft); }
.day b { font-size: .84rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.dots { display: flex; flex-wrap: wrap; gap: 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.f { background: var(--fr); }
.dot.i { background: var(--ir); }
.dot.u { background: var(--ink3); }
.rec-row { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.month-h { font-weight: 700; padding: 8px 2px 0; }

/* 그래프 */
.bar-row { display: grid; grid-template-columns: minmax(84px, 36%) minmax(0, 1fr); gap: 8px; align-items: center; padding: 3px 0; }
.bar-label { font-size: .9rem; min-width: 0; }
.bar-track { display: flex; align-items: center; gap: 6px; min-width: 0; }
.bar { height: 16px; border-radius: 0 4px 4px 0; background: var(--leaf); display: block; flex: none; min-width: 3px; }
.bar.f { background: var(--fr); }
.bar.i { background: var(--ir); }
.bar-n { font-size: .88rem; font-variant-numeric: tabular-nums; color: var(--ink2); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .86rem; color: var(--ink2); }
.key { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.stacked { display: flex; gap: 2px; height: 20px; border-radius: 4px; overflow: hidden; background: var(--surface); }
.stacked span { display: block; min-width: 4px; }
.e-good { background: var(--ok); }
.e-mid { background: var(--sun); }
.e-none { background: var(--ink3); }
.e-worse { background: var(--pepper); }
.matrix td.c { text-align: center; }
.mdot { display: inline-block; min-width: 22px; height: 22px; line-height: 22px; border-radius: 11px; font-size: .78rem; font-weight: 700; color: #fff; text-align: center; }
.mdot.f { background: var(--fr); }
.mdot.i { background: var(--ir); }
:root[data-theme="dark"] .mdot { color: #08130C; }

/* 판정 */
.verdict { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 12px; }
.verdict b { font: 400 1.5rem/1.2 var(--display); }
.verdict.ok { background: var(--ok-soft); border: 2px solid var(--ok); }
.verdict.no { background: var(--pepper-soft); border: 2px solid var(--pepper); }
.verdict.check { background: var(--need-soft); border: 2px dashed var(--need); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 460px) { .two { grid-template-columns: minmax(0, 1fr); } }
.two > div { background: var(--surface2); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.two h3 { font-size: .84rem; color: var(--ink3); font-weight: 500; }

/* 띄움 */
.modal-wrap { position: fixed; inset: 0; z-index: 40; background: rgba(8, 18, 12, .55); display: flex; align-items: flex-end; justify-content: center; }
.modal { background: var(--bg); width: 100%; max-width: 680px; max-height: 94%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 720px) { .modal-wrap { align-items: center; } .modal { border-radius: 16px; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(138px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; max-width: calc(100% - 32px); font-size: .95rem; }
.toast.bad { background: var(--pepper); color: var(--surface); }
.suggest { display: flex; flex-direction: column; gap: 6px; }
.sug { display: flex; justify-content: space-between; gap: 8px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 52px; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .18s ease-out; } @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } } }

</style>

<div id="app"><div style="padding:32px 16px;text-align:center">파프리카 방제수첩을 여는 중입니다.</div></div>
<script>
/* 작용기작 기준표.
 * 한국 표시기호: 농약 표시기준 [별표 8] (개정 2020.12.10, 2023.3.16), PSIS 게시 파일 etmcs01·etmcs02.
 * FRAC 코드·위험도: FRAC Code List 2026 (Last update: May 2026).
 * IRAC 코드: IRAC MoA Classification Version 11.5, February 2026.
 * 여기 없는 값은 만들지 않는다. 표에 없으면 engine.js가 '확인 필요'로 처리한다. */
(function (root) {
  'use strict';

  // risk: 높음 | 중간~높음 | 중간 | 낮음~중간 | 낮음 | 미확인(코드표에 'resistance not known' 또는 위험도 미표기)
  var FUNGI = {

      if (part.unclassified && !part.code) add('info', 'unclassified', (part.ai || '이 성분') + '은(는) 작용기작 미분류라 같은 성분 반복만 확인했습니다.', M.SRC.psisMoa);
      if (part.intl) add('info', 'intl', (part.ai || part.aiEn) + '의 PSIS 작용기작 표기가 비어 있어 ' + part.sys + ' 코드표 기준 ' + part.code + '(으)로 분류했습니다. 라벨 표기를 확인하세요.', part.sys === 'FRAC' ? M.SRC.frac : M.SRC.irac);

      // 그룹별 지침
      var g = M.GUIDE[part.sys + ':' + part.code];
      if (g) {
        var inCycle = ctx.cycle.filter(function (s) { return sprayParts(s).some(function (x) { return x.part.family === part.family && x.part.sys === part.sys; }); }).length;
        var total = ctx.cycleBySys[part.sys].length;
        if (g.window) {
          var recent = seq.slice(0, g.window.n - 1).filter(function (s) { return sprayParts(s).some(function (x) { return x.part.family === part.family && x.part.sys === part.sys; }); }).length;
          if (recent >= g.window.k) add('block', 'guide', g.label + ': 최근 살균제 ' + g.window.n + '회 중 ' + g.window.k + '회 상한에 걸립니다.', g);
        }
        if (g.table) {
          var key = soloCount > 1 ? 'mix' : 'solo';
          var t = total + 1;
          if (t <= 12) {
            var limit = g.table[key][t - 1];
            if (inCycle + 1 > limit) add('block', 'guide', g.label + ': 총 ' + t + '회 살포 기준 ' + (key === 'mix' ? '혼합' : '단독') + ' 상한 ' + limit + '회를 넘습니다(이번 작기 ' + inCycle + '회 사용).', g);
          } else if ((inCycle + 1) / t > g.over[key]) {
            add('block', 'guide', g.label + ': 12회 초과 시 ' + (key === 'mix' ? '혼합 1/2' : '단독 1/3') + ' 이하 권고를 넘습니다.', g);
          }
        }
        if (g.maxCycle && inCycle >= g.maxCycle) add('block', 'guide', g.label + ': 이번 작기 ' + inCycle + '회 사용, 권고 상한 ' + g.maxCycle + '회입니다.', g);
        if (g.share && total + 1 >= 3 && (inCycle + 1) / (total + 1) > g.share) {
          res.score -= 15;
          add('warn', 'guide', g.label + ': 이번에 쓰면 살포 비중이 ' + Math.round(((inCycle + 1) / (total + 1)) * 100) + '%가 되어 권고 ' + Math.round(g.share * 100) + '%를 넘습니다.', g);
        }
        if (g.preventive && ctx.severity === '심함') {
          res.score -= 8;
          add('warn', 'preventive', g.label + ' 계열은 예방이나 발병 초기 사용 권고입니다. 발생이 심할 때는 효과와 선택압을 함께 고려하세요.', g);
        }
        if (g.soloWarn && parts.length === 1) add('warn', 'solo', g.label + ': 단독 사용은 권고되지 않습니다. 교차저항이 없는 약과 함께 쓰는 제품을 고려하세요.', g);
      }

      var riskPen = { '높음': 6, '중간~높음': 4, '중간': 2, '낮음~중간': 1, '낮음': 0 };
      if (part.sys === 'FRAC' && riskPen[part.risk] !== undefined) res.score -= riskPen[part.risk];

      if (prev) compared.push({ part: part, prev: prev });
    });

    // 왜 겹치지 않는지
    var seen = {};
    var why = [];
    compared.forEach(function (c) {
      var k = c.part.sys;
      if (!seen[k]) {
        seen[k] = 1;
        var names = sprayParts(c.prev).filter(function (x) { return x.part.sys === k; }).map(function (x) { return x.item.brand + ' ' + partTag(x.part); });
        var mine = parts.filter(function (x) { return x.sys === k; }).map(partTag);
        why.push('직전 ' + (k === 'FRAC' ? '살균' : '살충') + ' 방제(' + shortDate(c.prev.date) + '): ' + uniq(names).join(', ') + ' / 이번 약: ' + uniq(mine).join(', '));
      }
    });
    res.noOverlap = why.length ? why.join(' · ') + ' — 서로 다른 교차저항 그룹입니다.' : '비교할 이전 방제 기록이 없습니다. 지난주 약을 입력하면 비교합니다.';

    // 방제 효과
    var eff = effectHistory(p, pest, ctx.hist);
    res.effect = eff[0] || null;
    if (eff[0]) {
      var ago = daysBetween(eff[0].date, ctx.today);
      if (FAILED[eff[0].rating] && ago <= 56) {
        add('block', 'effect', shortDate(eff[0].date) + ' ' + pest + ' 방제 결과가 "' + EFFECT_LABEL[eff[0].rating] + '"(으)로 기록돼 있습니다. 8주 동안 재추천하지 않습니다. 저항성으로 단정할 수는 없습니다.');
      } else if (eff[0].rating === 'good') { res.score += 12; }
      else if (FAILED[eff[0].rating]) { res.score -= 10; }
    }
    // 같은 작용기작의 다른 제품이 실패한 경우
    ctx.hist.forEach(function (s) {
      var e = s.effects && s.effects[pest];
      if (!e || !FAILED[e] || daysBetween(s.date, ctx.today) > 56) return;
      sprayParts(s).forEach(function (x) {
        if (sameProduct(p, x.item)) return;
        parts.forEach(function (part) {
          var r = relation(part, x.part);
          if (r === 'same_group' || r === 'same_ai' || r === 'sub_group') {
            res.score -= 15;
            add('warn', 'effect_group', shortDate(s.date) + ' ' + x.item.brand + '(' + partTag(x.part) + ') 방제 결과가 "' + EFFECT_LABEL[e] + '"(으)로 기록돼 있습니다. 같은 계열이라 순위를 낮췄습니다. 원인이 저항성인지는 알 수 없습니다.');
          }
        });
      });
    });

    // 함께 잡는 대상
    res.coverage = ctx.targets.filter(function (t) { return linesFor(p, t).length > 0; });
    res.score += Math.min(res.coverage.length - 1, 2) * 4;
    if (pick && !/경엽처리/.test(pick.method)) res.score -= 5;

    if (issues.some(function (i) { return i.level === 'block'; })) res.bucket = 'excluded';
    else if (res.bucket === 'ranked' && issues.some(function (i) { return i.level === 'except'; })) res.bucket = 'exception';

    buildReasons(res, ctx);
    return res;
  }

  function sameItem(p, it) {
    if (p.code && it.code && Number(p.code) === Number(it.code)) return true;
    if (p.item && it.item && p.item === it.item) return true;
    return !!(p.id && it.pid === p.id);
  }
  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }

  function buildReasons(res, ctx) {
    var r = res.reasons;
    var p = res.product;
    if (res.line) {
      r.push(res.reg.state === 'ok' ? '등록 확인: ' + res.line.crop + ' / ' + res.line.pest : '라벨 확인 입력: ' + res.pest);
    }
    var fresh = res.overlaps.every(function (o) { return !o.lastDate; });
    if (fresh) r.push(ctx.hist.length ? '기록된 방제에서 같은 작용기작을 쓴 적이 없습니다' : '방제 기록이 없어 이력 비교 없이 등록 정보로 골랐습니다');
    else {
      var oldest = res.overlaps.filter(function (o) { return o.lastDate; }).map(function (o) { return o.daysAgo; }).sort(function (a, b) { return a - b; })[0];
      r.push('같은 작용기작을 마지막으로 쓴 지 ' + oldest + '일 지났습니다');
    }
    if (res.coverage.length > 1) r.push('이번 대상 ' + res.coverage.join(', ') + '에 함께 등록돼 있습니다');
    if (res.effect && res.effect.rating === 'good') r.push(shortDate(res.effect.date) + ' 같은 대상에 효과가 좋았습니다');
    var risks = uniq(res.parts.filter(function (x) { return x.sys === 'FRAC' && x.code; }).map(function (x) { return x.risk; }));
    if (risks.length) r.push('FRAC 저항성 위험도: ' + risks.join(', '));
    if (p.tox) res.cautions.push('인축독성 ' + p.tox + ', 어독성 ' + p.fish);
    var guides = [];
    res.parts.forEach(function (x) {
      var g = guideFor(x);
      if (g && guides.indexOf(g) < 0) guides.push(g);
    });
    res.guides = guides;
  }

  /**
   * 추천. opts: {targets, houses, today, harvest, severity, products(보유 목록), sprays, cycleStart, assumedLast}
   * assumedLast: 기록이 없을 때 사용자가 고른 지난주 약. 임시 기록으로 비교에 넣는다.
   */
  function recommend(opts) {
    var today = opts.today;
    var sprays = (opts.sprays || []).slice();
    if (opts.assumedLast && opts.assumedLast.length) {
      sprays.push({ id: '_assumed', date: addDays(today, -7), houses: opts.houses || [], items: opts.assumedLast, targets: [], assumed: true });
    }
    var hist = historyFor(sprays, opts.houses, today);
    var yearAgo = addDays(today, -365);
    var from = opts.cycleStart || yearAgo;
    var cycle = hist.filter(function (s) { return s.date >= from; });
    var ctx = {
      today: today, harvest: opts.harvest || null, severity: opts.severity || '', targets: opts.targets || [], hist: hist, cycle: cycle,
      bySys: { FRAC: bySys(hist, 'FRAC'), IRAC: bySys(hist, 'IRAC') },
      cycleBySys: { FRAC: bySys(cycle, 'FRAC'), IRAC: bySys(cycle, 'IRAC') }
    };
    var inv = (opts.products || []).map(resolve).filter(Boolean);

    var groups = ctx.targets.map(function (pest) {
      var cand = [];
      var umbrella = [];
      inv.forEach(function (p) {
        if (linesFor(p, pest).length) cand.push(evaluate(p, pest, ctx));
        else if (UMBRELLA[pest] && linesFor(p, UMBRELLA[pest]).length) umbrella.push(p);
      });
      var by = function (b) { return cand.filter(function (c) { return c.bucket === b; }); };
      var inWindow = function (c) { return c.recentDays !== null && c.recentDays <= 30 ? 1 : 0; };
      var ranked = spreadMoa(by('ranked').sort(function (a, b) {
        return inWindow(a) - inWindow(b) || b.score - a.score || (a.phi === null ? 99 : a.phi) - (b.phi === null ? 99 : b.phi) || (a.product.brand < b.product.brand ? -1 : 1);
      }), 3);
      var g = {
        pest: pest, kind: pestKind(pest), ranked: ranked.slice(0, 3), more: ranked.slice(3), exception: by('exception'), timing: by('timing'),
        verify: by('verify'), excluded: by('excluded'), umbrella: umbrella, inventoryCount: cand.length, altGroups: []
      };
      if (ranked.length < 3) g.altGroups = alternatives(pest, ctx, inv);
      return g;
    });

    return {
      today: today, targets: ctx.targets, groups: groups,
      last: { FRAC: ctx.bySys.FRAC[0] || null, IRAC: ctx.bySys.IRAC[0] || null },
      combos: combos(groups, opts.mixes),
      cycleSet: !!opts.cycleStart
    };
  }

  /** 앞의 n개가 서로 다른 작용기작이 되도록 순서를 바꾼다. 같은 계열뿐이면 그대로 채운다. */
  function spreadMoa(list, n) {
    var top = [];
    var rest = [];
    list.forEach(function (c) {
      var clash = top.some(function (o) {
        return o.parts.some(function (p) {
          return c.parts.some(function (q) {
            var r = relation(p, q);
            return r === 'same_ai' || r === 'same_group' || r === 'same_low' || r === 'sub_group';
          });
        });
      });
      if (!clash && top.length < n) top.push(c); else rest.push(c);
    });
    return top.concat(rest);
  }

  /** 보유 목록 밖의 등록 약 가운데 아직 안 쓴 작용기작. 구입 참고용이며 추천이 아니다. */
  function alternatives(pest, ctx, inv) {
    var owned = {};
    inv.forEach(function (p) { if (p.code) owned[p.code] = 1; });
    var map = {};
    Object.keys(REF.L).forEach(function (code) {
      if (owned[code]) return;
      var lines = linesOfCode(code).filter(function (l) { return matchesPest(l.pest, pest) && phiDays(l.phiText) !== null; });
      if (!lines.length) return;
      var p = refProduct(code);
      var parts = partsOf(p).filter(function (x) { return !x.none; });
      if (parts.length !== 1 || !parts[0].code) return;
      var part = parts[0];
      var prev = ctx.bySys[part.sys] && ctx.bySys[part.sys][0];
      var clash = prev && sprayParts(prev).some(function (x) { var r = relation(part, x.part); return r === 'same_ai' || r === 'same_group' || r === 'sub_group'; });
      if (clash) return;
      var k = partTag(part);
      if (!map[k]) map[k] = { tag: k, group: part.groupName, brands: [], lastDate: usageOf(part, ctx.hist, ctx.today).lastDate };
      if (map[k].brands.length < 3) map[k].brands.push(p.brand);
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return (a.lastDate ? 1 : 0) - (b.lastDate ? 1 : 0); }).slice(0, 6);
  }

  function combos(groups, mixes) {
    var out = [];
    for (var i = 0; i < groups.length; i++) {
      for (var j = i + 1; j < groups.length; j++) {
        groups[i].ranked.forEach(function (a) {
          groups[j].ranked.forEach(function (b) {
            if (sameItem(a.product, { code: b.product.code, item: b.product.item, pid: b.product.id })) return;
            var m = checkMix([a.product, b.product], mixes);
            if (m.status === 'ok') out.push({ a: a.product, b: b.product, pests: [groups[i].pest, groups[j].pest], cond: m.pairs[0].conditions, ev: m.pairs[0].evidence });
          });
        });
      }
    }
    return out.slice(0, 4);
  }

  /* ---------- 혼용 ---------- */
  var mixIdx = null;
  function buildMixIndex() {
    mixIdx = new Map();
    var names = REF.MIX.names;
    function put(a, b, e) {
      var k = a + '~' + b;
      if (!mixIdx.has(k)) mixIdx.set(k, []);
      mixIdx.get(k).push(e);
    }
    REF.MIX.rows.forEach(function (r) {
      var a = names[r[0]];
      r[4].forEach(function (bi) {
        var b = names[bi];
        var e = { res: r[1], src: r[2], crop: r[3], from: a, note: '' };
        put(a, b, e);
        put(b, a, e);
      });
    });
    REF.MIX.notes.forEach(function (n) {
      var list = mixIdx.get(names[n[0]] + '~' + names[n[1]]) || [];
      list.forEach(function (e) { if (e.from === names[n[0]]) e.note = n[2]; });
    });
  }
  function mixKey(p) {
    var form = formOf(p.item);
    var abbr = FORM_ABBR[form] || form || (p.form || '');
    return clean(p.psisBrand || p.brand).replace(/[\s\-·.]/g, '') + '|' + abbr;
  }
  function methodBase(m) { return clean(m).replace(/\(.*\)/, ''); }

  var SRC_NAME = { hannong: '팜한농 혼용정보', samgong: '한국삼공 혼용정보', sb: 'SB성보 제품 혼용정보', bayer: '바이엘 자료(팜한농 혼용정보 수록)' };
  var SYMPTOM = /갈반|착색|약해|낙엽|고사|황화|반점/;

  function userMixFor(a, b, mixes) {
    var ka = mixKey(a); var kb = mixKey(b);
    return (mixes || []).filter(function (m) { return (m.a === ka && m.b === kb) || (m.a === kb && m.b === ka); });
  }

  function checkPair(a, b, mixes) {
    if (!mixIdx) buildMixIndex();
    var pair = {
      a: a, b: b, status: 'check', reason: '', conditions: [], evidence: [], physical: { state: 'unknown', text: '자료 없음' }, phyto: { state: 'unknown', text: '자료 없음' }, reference: []
    };
    var ra = regStatus(a); var rb = regStatus(b);
    var blockers = [];
    [[a, ra], [b, rb]].forEach(function (x) {
      if (x[1].state === 'no') blockers.push(x[0].brand + '은(는) 파프리카에 등록되지 않아 혼용할 수 없습니다.');
    });
    [a, b].forEach(function (p) {
      var form = formOf(p.item);
      if (form && NO_DILUTE.test(form)) blockers.push(p.brand + '은(는) ' + form + '라 물에 희석해 섞지 않습니다.');
    });
    var ma = uniq((a.lines || []).map(function (l) { return methodBase(l.method); }));
    var mb = uniq((b.lines || []).map(function (l) { return methodBase(l.method); }));
    if (ma.length && mb.length && !ma.some(function (x) { return mb.indexOf(x) >= 0; })) {
      blockers.push('등록된 사용 방법이 다릅니다(' + a.brand + ': ' + ma.join('·') + ', ' + b.brand + ': ' + mb.join('·') + ').');
    }

    var ev = (mixIdx.get(mixKey(a) + '~' + mixKey(b)) || []).map(function (e) {
      return { res: e.res, src: e.src, srcName: SRC_NAME[e.src], crop: e.crop === 'P' ? '고추(단고추류)' : '고추', note: e.note, url: M.SRC[e.src] ? M.SRC[e.src].url : '' };
    });
    var allUsers = userMixFor(a, b, mixes);
    var teamSays = allUsers.filter(function (u) { return u.team; });
    var users = allUsers.filter(function (u) { return !u.team; });
    pair.evidence = ev;
    pair.user = users;
    pair.team = teamSays.length > 0;

    var x = ev.filter(function (e) { return e.res === 'X'; });
    var okP = ev.filter(function (e) { return e.res !== 'X' && e.crop !== '고추'; });
    var okG = ev.filter(function (e) { return e.res !== 'X' && e.crop === '고추'; });
    var tri = ev.filter(function (e) { return e.res === 'T'; });
    var userNo = users.filter(function (u) { return u.result === 'no'; });
    var userOk = users.filter(function (u) { return u.result === 'ok'; });

    if (blockers.length) {
      pair.status = 'no';
      pair.reason = blockers.join(' ');
      pair.physical = { state: 'bad', text: '사용 방법상 함께 살포 불가' };
      pair.phyto = { state: 'unknown', text: '판단 대상 아님' };
    } else if (x.length || userNo.length) {
      pair.status = 'no';
      var sym = x.filter(function (e) { return SYMPTOM.test(e.note); });
      if (x.length) {
        pair.reason = x[0].srcName + '에 혼용 불가로 표시돼 있습니다' + (x[0].note ? ' (메모: ' + x[0].note + ')' : '') + '.';
      } else {
        pair.reason = '내가 저장한 확인 기록에 혼용 불가로 돼 있습니다.';
      }
      if (sym.length) {
        pair.phyto = { state: 'bad', text: '약해 메모: ' + sym[0].note };
        pair.physical = { state: 'unknown', text: '자료에 표기 없음' };
      } else {
        pair.physical = { state: 'unknown', text: '불가 사유가 표에 없어 물리성 문제인지 알 수 없음' };
        pair.phyto = { state: 'unknown', text: '불가 사유가 표에 없어 약해 문제인지 알 수 없음' };
      }
    } else if (okP.length || userOk.length) {
      pair.status = 'ok';
      if (okP.length) {
        pair.reason = okP[0].srcName + '의 고추(단고추류) 표에 혼용 가능으로 수록돼 있습니다.';
        pair.physical = { state: 'ok', text: '제조사 표에 혼용 가능 수록. 표에 물리성만 따로 구분한 값은 없음' };
        pair.phyto = { state: 'partial', text: '고추(단고추류) 기준 표기. 파프리카 품종·재배 환경별 약해는 확인 안 됨' };
      } else {
        pair.reason = '내가 저장한 확인 기록에 혼용 가능으로 돼 있습니다.';
      }
      if (tri.length) pair.conditions.push('기준량 엄수 및 혼용 즉시 사용(제조사 표 △)');
      okP.forEach(function (e) { if (e.note && pair.conditions.indexOf(e.note) < 0) pair.conditions.push(e.note); });
    } else if (okG.length) {
      pair.status = 'check';
      pair.reason = '고추 기준 자료만 있습니다. 단고추류(파프리카) 표기가 없어 혼용 가능으로 판단하지 않습니다.';
      pair.reference = okG;
      pair.physical = { state: 'partial', text: '고추 기준 표에 혼용 가능 수록' };
      pair.phyto = { state: 'unknown', text: '파프리카 약해 자료 없음' };

  function calView(rows) {

      var dots = [];
      list.forEach(function (s) {

    }
    var inMonth = rows.filter(function (s) { return s.date.slice(0, 7) === h.month; });

    return '<div class="between" style="align-items:center"><button type="button" class="btn small" data-act="calMove" data-v="-1">이전 달</button><b class="tnum">' + p[0] + '년 ' + p[1] + '월 · ' + inMonth.length + '회</b><button type="button" class="btn small" data-act="calMove" data-v="1">다음 달</button></div>' +
      '<div class="cal">' + cells + '</div><div class="legend"><span><i class="dot f"></i> 살균 작용기작</span><span><i class="dot i"></i> 살충 작용기작</span></div>' +
      '<div class="stack">' + (shown.length ? shown.map(recRow).join('') : '<p class="muted">' + (h.day ? h.day + ' 기록이 없습니다.' : '이 달 기록이 없습니다.') + '</p>') + '</div>';
  }
  A.calMove = function (t) {

  }

  function bars(rows, cls) {
    if (!rows.length) return '<p class="muted small">기록이 없습니다.</p>';
    var max = Math.max.apply(null, rows.map(function (r) { return r.n; }));
    return rows.map(function (r) {
      return '<div class="bar-row" title="' + esc(r.label) + ': ' + r.n + '회"><div class="bar-label">' + esc(r.label) + '</div><div class="bar-track"><span class="bar ' + (r.cls || cls || '') + '" style="width:calc((100% - 34px) * ' + (r.n / max).toFixed(3) + ')"></span><span class="bar-n">' + r.n + '</span></div></div>';
    }).join('');
  }
  function countBy(rows, fn) {
    var c = {};
    rows.forEach(function (s) { uniqSort(fn(s)).forEach(function (k) { c[k] = (c[k] || 0) + 1; }); });
    return Object.keys(c).map(function (k) { return { label: k, n: c[k] }; }).sort(function (a, b) { return b.n - a.n; });
  }
  function weekMatrix(rows) {
    var t = U.today();
    var cols = [3, 2, 1, 0].map(function (w) { return { from: PE.addDays(t, -(w * 7 + 6)), to: PE.addDays(t, -(w * 7)), label: w === 0 ? '이번 주' : w + '주 전' }; });
    var map = {};
    rows.forEach(function (s) {
      cols.forEach(function (c, i) {
        if (s.date < c.from || s.date > c.to) return;
        (s.items || []).forEach(function (it) {
          PE.itemParts(it).forEach(function (p) {
            if (p.none || !p.code) return;
            var k = PE.partTag(p);
            if (!map[k]) map[k] = { sys: p.sys, group: p.groupName, n: [0, 0, 0, 0] };
            map[k].n[i]++;
          });
        });
      });
    });
    var keys = Object.keys(map).sort(function (a, b) { return map[a].sys < map[b].sys ? -1 : map[a].sys > map[b].sys ? 1 : a < b ? -1 : 1; });
    if (!keys.length) return '<p class="muted small">최근 4주 기록이 없습니다.</p>';
    return '<div class="tbl matrix"><table><thead><tr><th>작용기작</th>' + cols.map(function (c) { return '<th style="text-align:center">' + c.label + '</th>'; }).join('') + '</tr></thead><tbody>' + keys.map(function (k) {
      var r = map[k];
      var c = r.sys === 'FRAC' ? 'f' : 'i';
      return '<tr><td title="' + esc(r.group || '') + '">' + esc(k) + '</td>' + r.n.map(function (n) { return '<td class="c">' + (n ? '<span class="mdot ' + c + '" title="' + n + '회">' + n + '</span>' : '') + '</td>'; }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
  }
  function effectStats(rows) {
    var c = { good: 0, mid: 0, none: 0, worse: 0 };
    var by = {};
    rows.forEach(function (s) {
      Object.keys(s.effects || {}).forEach(function (p) {
        var e = s.effects[p];
        if (c[e] === undefined) return;
        c[e]++;
        by[p] = by[p] || { good: 0, mid: 0, none: 0, worse: 0 };
        by[p][e]++;
      });
    });
    var total = c.good + c.mid + c.none + c.worse;
    if (!total) return '<p class="muted small">입력된 방제 효과가 없습니다.</p>';
    var seg = ['good', 'mid', 'none', 'worse'].filter(function (k) { return c[k]; }).map(function (k) { return '<span class="e-' + k + '" style="flex:' + c[k] + '" title="' + PE.EFFECT_LABEL[k] + ' ' + c[k] + '건"></span>'; }).join('');
    var legend = ['good', 'mid', 'none', 'worse'].map(function (k) { return '<span><i class="key e-' + k + '"></i>' + PE.EFFECT_LABEL[k] + ' ' + c[k] + '건</span>'; }).join('');
    var rowsHtml = Object.keys(by).map(function (p) { var b = by[p]; return '<tr><td>' + esc(p) + '</td><td class="n">' + b.good + '</td><td class="n">' + b.mid + '</td><td class="n">' + b.none + '</td><td class="n">' + b.worse + '</td></tr>'; }).join('');
    return '<div class="stacked" role="img" aria-label="방제 효과 비율">' + seg + '</div><div class="legend">' + legend + '</div><details class="more"><summary>병해충별 표</summary><div class="tbl"><table><thead><tr><th>병해충</th><th>좋음</th><th>보통</th><th>없음</th><th>증가</th></tr></thead><tbody>' + rowsHtml + '</tbody></table></div></details>';
  }
  function statsView(rows) {
    var month = U.today().slice(0, 7);
    var thisMonth = rows.filter(function (s) { return s.date.slice(0, 7) === month; });
    var byPest = countBy(rows, function (s) { return s.targets || []; }).slice(0, 8);

    var top = byMoa[0];

    return '<div class="stack-lg"><div class="kpis"><div class="kpi"><b>' + thisMonth.length + '회</b><span class="small muted">이번 달 총 방제</span></div><div class="kpi"><b>' + rows.length + '회</b><span class="small muted">조건에 맞는 전체 방제</span></div></div>' +
      '<p>' + (top ? '가장 많이 쓴 작용기작은 <b>' + esc(top.label) + '</b>로 ' + top.n + '회입니다. ' : '') + (failed ? '효과가 없거나 병해충이 늘었다고 기록한 방제가 ' + failed + '회 있습니다.' : '') + '</p>' +

    var rows = S.hist.preview.records.map(function (r, i) {
      var old = r.id && have[r.id];
      return Object.assign({}, r, { id: r.id || Store.newId('s'), createdAt: old ? old.createdAt : Date.now() + i, updatedAt: Date.now() });
    });
    if (S.demo) { rows.forEach(function (r) { S.demoData.sprays.push(r); }); S.hist.preview = null; U.toast('예시 모드라 저장되지 않습니다.'); U.render(true); return; }
    U.toast('등록 중입니다…');
    Store.saveMany('sprays', rows).then(function (n) { S.hist.preview = null; U.toast(n + '건 등록했습니다.'); U.render(true); }).catch(function (e) { U.toast(e.message, 'bad'); });
  };

  /* ---------- 설정과 자료 출처 ---------- */
  function statusRow(name, state, text, src) {
    var pill = state === 'ok' ? '<span class="pill ok">수록</span>' : state === 'part' ? '<span class="pill warn">일부 수록</span>' : '<span class="need">연동 안 됨</span>';
    return '<div class="stack" style="gap:2px"><div class="between"><b>' + esc(name) + '</b>' + pill + '</div><p class="small">' + esc(text) + U.srcA(src) + '</p></div>';
  }
  U.V.settings = function () {
    var st = U.settings();
    var meta = PE.REF.meta;
    var saveMode = S.demo ? '예시 모드입니다. 저장되지 않습니다.' : Store.note;
    var houses = (st.houses || []).map(function (h, i) { return '<button type="button" class="chip sm" data-act="houseDel" data-i="' + i + '">' + esc(h) + ' ' + U.ic('no').replace('class="ic"', 'class="ic" style="width:16px;height:16px"') + '</button>'; }).join('');
    var body = '<div class="stack-lg"><section class="card stack"><h2>재배동</h2><div class="row">' + (houses || '<span class="muted small">등록된 재배동이 없습니다.</span>') + '</div><div class="row"><input class="input grow" style="flex:1 1 140px;width:auto" id="houseIn" placeholder="예: 1동" autocomplete="off"><button type="button" class="btn" data-act="houseAdd">추가</button></div></section>' +
      '<section class="card stack"><h2>작기 시작일</h2><p class="small">사용 횟수와 FRAC 상한을 이 날짜부터 셉니다. 정식일을 넣으세요.</p><input class="input" type="date" id="cycleIn" data-ch="cycle" value="' + esc(st.cycleStart || '') + '"></section>' +
      '<section class="card stack"><h2>저장 위치</h2><p>' + esc(saveMode) + '</p><div class="row"><button type="button" class="btn grow" data-act="backup">전체 백업 내려받기</button><label class="btn grow">백업 복원<input type="file" id="restoreFile" data-ch="restore" accept=".json" hidden></label></div></section>' +
      '<section class="card stack"><h2>우리 방제 엑셀</h2><p class="small">' + (U.team() ? esc(U.team().meta.file || '') + ' · ' + esc(U.team().meta.importedAt || '') + ' 반영' : '아직 올리지 않았습니다.') + ' 엑셀을 고친 뒤 다시 올리면 수량과 리스트 값이 바뀝니다.</p><div class="row"><label class="btn grow">엑셀 다시 올리기<input type="file" id="teamFile" data-ch="histFile" accept=".xlsx,.xls" hidden></label><button type="button" class="btn grow" data-act="go" data-to="listcheck">리스트 대조 결과</button></div></section>' +
      '<section class="stack"><h2>자료 출처와 연동 상태</h2><div class="card stack">' +
      statusRow('농약 등록 정보', 'ok', '농약안전정보시스템 농약 검색 조회본 ' + meta.psisDate + '. 파프리카 적용 ' + meta.paprikaRows.toLocaleString() + '건, 제품 ' + meta.allProducts.toLocaleString() + '개. 조회 뒤 바뀐 등록은 반영되지 않습니다.', M.SRC.psis) +
      statusRow('PSIS 실시간 조회', 'none', '연동돼 있지 않습니다. 최신 여부는 PSIS에서 직접 확인하세요. OpenAPI는 인증키 신청이 필요합니다.', M.SRC.psis) +
      statusRow('파프리카 작물명', 'ok', 'PSIS 작물명 단고추류, 고추(단고추류 포함), 착색단고추(류)를 파프리카 등록으로 봅니다. "고추"로만 등록된 약은 제외합니다.', M.SRC.mafraPepper) +
      statusRow('한국 작용기작 표기', 'ok', '농약 표시기준 별표 8 (개정 2020.12.10, 2023.3.16). 성분표 ' + PE.REF.AI.length + '건.', M.SRC.psisMoa) +
      statusRow('FRAC 분류', 'ok', 'FRAC Code List 2026. 한국 기호와의 대응은 코드표를 대조해 넣었습니다.', M.SRC.frac) +
      statusRow('IRAC 분류', 'ok', 'IRAC MoA Classification 11.5.', M.SRC.irac) +
      statusRow('그룹별 살포 지침', 'part', 'FRAC 그룹별 권고 중 QoI, SDHI, AP, DMI, KRI, 페닐아미드, 벤지미다졸, 디카복시미드, CAA, OSBPI, QiI를 넣었습니다. 파프리카를 직접 명시한 권고는 없어 가장 가까운 항목을 적용하며 화면에 표시합니다.', M.SRC.fracGroups) +
      statusRow('혼용 자료', 'part', '팜한농, 한국삼공, SB성보, 바이엘 공개 자료 ' + PE.REF.MIX.rows.reduce(function (n, r) { return n + r[4].length; }, 0).toLocaleString() + '건. 통합 공식표가 아니고 기준연도 미표기가 많습니다. 표에 없으면 "확인 필요"입니다.', M.SRC.hannong) +
      statusRow('천적·수분벌 영향', 'none', '자료가 없습니다. 라벨과 공급사 자료를 확인하세요.') +
      statusRow('재입실 시간', 'none', 'PSIS 자료에서 확인되지 않았습니다.') +
      '</div><p class="small muted">PSIS 자료는 공공누리 조건을 따르고, FRAC 코드표는 교육 목적 외 상업적 이용에 FRAC 허가가 필요합니다. 이 앱을 판매·배포하려면 이용 조건을 먼저 확인하세요.</p></section></div>';
    return { title: '설정과 자료 출처', body: body };
  };
  function saveSettings(patch) {
    var next = Object.assign({}, U.settings(), patch, { id: 'main', started: true });
    if (S.demo) { S.demoData.settings = next; U.render(true); return; }
    U.save('settings', next).then(function () { U.render(true); }).catch(function () { /* 알림 표시됨 */ });
  }
  A.houseAdd = function () {
    var el = document.getElementById('houseIn');
    var v = el ? el.value.trim() : '';
    if (!v) return;
    var l = (U.settings().houses || []).slice();
    if (l.indexOf(v) < 0) l.push(v);
    saveSettings({ houses: l });
  };
  A.houseDel = function (t) {
    var l = (U.settings().houses || []).slice();
    var name = l[Number(t.dataset.i)];
    U.confirm(name + '을(를) 재배동 목록에서 뺄까요? 기록은 남습니다.', '빼기', function () { l.splice(Number(t.dataset.i), 1); saveSettings({ houses: l }); });
  };
  U.C.cycle = function (el) { saveSettings({ cycleStart: el.value }); };
  A.backup = function () {
    var D = U.D();
    var data = JSON.stringify({ app: 'paprika', version: 1, at: U.today(), products: D.products, sprays: D.sprays, mixes: D.mixes, settings: D.settings }, null, 1);
    XL.saveFile('파프리카방제수첩_백업_' + U.today() + '.json', data).then(function (ok) { if (ok) U.toast('내려받았습니다.'); }).catch(function (e) { U.toast(e.message, 'bad'); });
  };
  U.C.restore = function (el) {
    var f = el.files && el.files[0];
    if (!f) return;
    f.text().then(function (t) {
      var o = JSON.parse(t);
      if (o.app !== 'paprika') throw new Error('이 앱의 백업 파일이 아닙니다.');
      U.confirm('백업의 기록 ' + (o.sprays || []).length + '건, 농약 ' + (o.products || []).length + '개를 현재 자료에 합칠까요? 같은 번호는 백업 내용으로 바뀝니다.', '복원', function () {
        if (S.demo) { U.toast('예시 모드에서는 복원할 수 없습니다. 내 자료로 시작하세요.', 'bad'); return; }
        Store.saveMany('products', o.products || []).then(function () { return Store.saveMany('sprays', o.sprays || []); }).then(function () { return Store.saveMany('mixes', o.mixes || []); }).then(function () {
          return o.settings ? Store.save('settings', 'main', Object.assign({}, o.settings, { started: true })) : null;
        }).then(function () { U.toast('복원했습니다.'); U.render(true); }).catch(function (e) { U.toast(e.message, 'bad'); });
      });
    }).catch(function (e) { U.toast(e.message || '파일을 읽지 못했습니다.', 'bad'); });
  };

  /* ---------- 시작 ---------- */
  // 보기 전용으로 확인되면 저장으로 이어지는 단추와 파일 올리기를 처음에 막는다. 입력을 다 한 뒤 거절되지 않게 한다.
  var WRITE_ACTS = {
    finish: 1, newRecord: 1, recEdit: 1, recSave: 1, recDel: 1, setEffect: 1, startReal: 1,
    invEdit: 1, invDel: 1, addCode: 1, addLink: 1, addSave: 1, addManualFrom: 1, pvSave: 1,
    mixForm: 1, mixSave: 1, mixDel: 1, histImport: 1, teamSave: 1, houseAdd: 1, houseDel: 1
  };
  var WRITE_CH = { cycle: 1, restore: 1, histFile: 1, invFile: 1 };
  function readOnlyStop(name, set) {
    if (!set[name] || !U.readOnly()) return false;
    U.toast(Store.readOnlyText, 'bad');
    return true;
  }
  document.addEventListener('click', function (e) {
    var label = e.target.closest('label');
    var file = label && label.querySelector('input[type=file][data-ch]');
    if (file && readOnlyStop(file.dataset.ch, WRITE_CH)) { e.preventDefault(); return; }
    var t = e.target.closest('[data-act]');
    if (!t || t.disabled) return;
    var fn = A[t.dataset.act];
    if (!fn) return;
    e.preventDefault();
    if (readOnlyStop(t.dataset.act, WRITE_ACTS)) return;
    fn(t, e);
  });
  document.addEventListener('input', function (e) {
    var t = e.target.closest('[data-in]');
    if (t && U.I[t.dataset.in]) U.I[t.dataset.in](t);
  });
  document.addEventListener('change', function (e) {
    var t = e.target.closest('[data-ch]');
    if (!t || !U.C[t.dataset.ch]) return;
    if (readOnlyStop(t.dataset.ch, WRITE_CH)) {
      if (t.type === 'file') t.value = ''; else U.render(true);
      return;
    }
    U.C[t.dataset.ch](t);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && U.$('.modal-wrap')) U.closeModal();
    if (e.key === 'Enter' && e.target.id === 'houseIn') A.houseAdd();
  });
  U.afterRender = function () { U.renderTray(); };

  Store.onChange(function () {
    if (S.draft && U.$('.modal-wrap')) { U.renderLater = true; return; } // 기록 입력 중에는 화면을 흔들지 않고, 창을 닫을 때 다시 그린다
    U.syncDemo();
    U.render(true);
  });
  U.restorePlan();
  U.render();
  Store.init();
})(window);

</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
</script>
</body>
</html>
